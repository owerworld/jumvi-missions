name: M0 isolated staging
on:
  push:
    branches: [codex/lock09-implementation]
permissions:
  contents: read
concurrency:
  group: jumvi-missions-staging
  cancel-in-progress: false
jobs:
  staging:
    if: github.repository == 'owerworld/jumvi-missions' && github.ref == 'refs/heads/codex/lock09-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: jumvi-staging
      url: https://jumvi-missions-staging.saykirtasiye.workers.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate staging boundary
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const c = JSON.parse(readFileSync('wrangler.staging.json', 'utf8'));
          assert.equal(c.name, 'jumvi-missions-staging');
          assert.equal(c.main, 'src/m0-staging-worker.mjs');
          assert.equal(c.workers_dev, true);
          assert.equal(c.preview_urls, false);
          assert.deepEqual(c.routes, []);
          assert.deepEqual(c.analytics_engine_datasets, []);
          assert.deepEqual(c.assets, {directory: '.wrangler/m0-staging/assets', binding: 'ASSETS', run_worker_first: true});
          const allowed = new Set(['$schema','name','main','compatibility_date','workers_dev','preview_urls','routes','assets','analytics_engine_datasets','observability']);
          for (const k of Object.keys(c)) assert(allowed.has(k), `Unexpected staging setting: ${k}`);
          JS
      - name: Package baseline public assets
        run: node tools/build-m0-staging.mjs
      - name: Verify isolation contracts
        run: node --test tests/isolation/m0-staging.test.mjs
      - name: Deploy only staging Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: b6967726a2532e18ddfd79a1b21f4e39
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.136.1 deploy --config wrangler.staging.json --message "M0 staging $GITHUB_SHA"
