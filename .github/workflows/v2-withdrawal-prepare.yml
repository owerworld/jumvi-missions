name: Prepare V2-only withdrawal version
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jumvi-v2-review-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'owerworld/jumvi-missions' && github.ref == 'refs/heads/codex/lock09-implementation'
    runs-on: ubuntu-latest
    environment: jumvi-v2-review
    timeout-minutes: 15
    env:
      V2_EXACT_ARTIFACT: ${{ vars.V2_EXACT_ARTIFACT }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Rebuild and verify the unchanged reviewed artifact
        run: |
          JUMVI_BASE_PATH=/v2/ node tools/build-app.mjs
          node tools/build-v2-legacy-compat.mjs
          node --input-type=module -e "import{readFileSync}from'node:fs';import assert from'node:assert/strict';const m=JSON.parse(readFileSync('dist-v2/v2/release-manifest.json'));assert.equal(m.release,process.env.V2_EXACT_ARTIFACT);const c=JSON.parse(readFileSync('wrangler.v2.withdrawn.json'));assert.equal(c.name,'jumvi-missions-v2-review');assert.deepEqual(c.routes,[{pattern:'https://qr.jumvi.co/v2*',zone_name:'jumvi.co'}]);"
      - name: Upload inactive V2-only withdrawal target
        env:
          CLOUDFLARE_ACCOUNT_ID: b6967726a2532e18ddfd79a1b21f4e39
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_V2_REVIEW_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.136.1 versions upload --config wrangler.v2.withdrawn.json --message "Prepared V2-only withdrawal $V2_EXACT_ARTIFACT"
      - name: Confirm upload did not change live V2 or root
        run: |
          node --input-type=module -e "import assert from'node:assert/strict';const o='https://qr.jumvi.co';for(const p of ['/v2/','/v2/tr/']){const r=await fetch(o+p);assert.equal(r.status,200);assert.equal(r.headers.get('x-jumvi-environment'),'v2-review')}const m=await fetch(o+'/v2/release-manifest.json').then(r=>r.json());assert.equal(m.release,process.env.V2_EXACT_ARTIFACT);const r=await fetch(o+'/');assert.equal(r.status,200);console.log('Inactive withdrawal version uploaded; live V2 and root still respond normally')"
