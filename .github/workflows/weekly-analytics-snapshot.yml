name: Weekly Analytics Snapshot

# Runs tools/generate-weekly-snapshot.mjs on a schedule.
#
# The script's own header calls this "MANUAL ONLY... Faz 1 spec is explicit
# that this must not run on a schedule in this phase" — that constraint is a
# deliberate, superseded decision (product/Ar-Ge asked for an automatic
# weekly report; see the PR that added this workflow). It is recorded here,
# not silently dropped, so a future reader knows the manual-only comment in
# the script itself is now historical, not current policy.
#
# Every Monday 08:00 Europe/Istanbul (UTC+3, no DST) — i.e. 05:00 UTC — this
# queries Cloudflare Analytics Engine for the ISO week that just closed
# (Mon-Sun), which generate-weekly-snapshot.mjs does by default with no
# --week argument. If the resulting JSON differs from what's on disk, it
# opens a PR with the new snapshot for a human to review.
#
# Deliberately does NOT push to main directly. The report is always a PR,
# which stays the audit record of when a week was published.
#
# ZAMANLANMIŞ çalışma o PR'ı kendisi merge eder (bkz. aşağıdaki "Publish the
# snapshot" adımı ve CLAUDE.md'deki "Otomatik yayın istisnası"). Bu, CLAUDE.md'
# nin "main'e merge yalnızca açık onayla" kuralına sahibi tarafından konmuş dar
# bir istisnadır ve sebebi somut: 2026-36 ile 2026-37 raporları merge edilmeyi
# bekleyip iki hafta boyunca panelde hiç görünmedi. Elle tetiklenen backfill
# ise ASLA otomatik yayınlanmaz — geçmişi yeniden yazabilen tek yol o.
#
# Yan fayda: her hafta anında yayınlandığı için bir sonraki haftanın dalı
# zaten öncekini içeren bir main'den üretiliyor ve data/snapshots/index.json
# çakışması (2026-33/34 ve 2026-36/37'de iki kez yaşandı) ortadan kalkıyor.
#
# Needs a CLOUDFLARE_API_TOKEN repo secret (Account Analytics: Read).
# CLOUDFLARE_ACCOUNT_ID is optional — the script discovers it via the API
# when the account only has one, same as running this locally.
#
# Manual "Run workflow" accepts an optional `week` input (e.g. 2026-33) to
# backfill or regenerate a specific ISO week instead of the last completed
# one — validated here before it ever reaches the script; an unrecognised
# format fails the run instead of silently falling back to "last week".
# No credentials are ever echoed to the log.

on:
  schedule:
    - cron: '0 5 * * 1' # Monday 05:00 UTC = 08:00 Europe/Istanbul
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week to (re)generate, e.g. 2026-33. Leave empty for the last complete week.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate the snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEEK_INPUT: ${{ inputs.week }}
        run: |
          if [ -z "$WEEK_INPUT" ]; then
            node tools/generate-weekly-snapshot.mjs
          elif [[ "$WEEK_INPUT" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            node tools/generate-weekly-snapshot.mjs --week "$WEEK_INPUT"
          else
            echo "::error::week input must look like 2026-33, got \"$WEEK_INPUT\""
            exit 1
          fi

      - name: Check for a new/changed snapshot
        id: diff
        run: |
          # A brand-new week's snapshot file (data/snapshots/YYYY-WW.json) is
          # UNTRACKED the first time it's generated — `git diff` (staged vs
          # working tree for TRACKED files only) never sees it, so the week
          # extraction used to come up empty on every genuine backfill of a
          # new week, even though data/snapshots/index.json (tracked, always
          # rewritten alongside the snapshot) DID show up as changed. That
          # produced changed=true with week="", which went on to build the
          # branch name "snapshot/" and fail. `git status --porcelain
          # --untracked-files=all` sees both tracked modifications and new
          # untracked files, so the week is found regardless of whether this
          # run is a first-time backfill or a re-run over an existing file.
          changes=$(git status --porcelain --untracked-files=all -- data/snapshots)
          if [ -z "$changes" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          week=$(printf '%s\n' "$changes" | grep -oE '[0-9]{4}-[0-9]{2}' | head -1)
          # Fail closed: a change with no resolvable ISO week must never reach
          # the next step and build "snapshot/<empty>" as a branch name.
          if [[ ! "$week" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            echo "::error::snapshot changed but ISO week could not be resolved"
            printf '%s\n' "$changes"
            exit 1
          fi
          echo "week=$week" >> "$GITHUB_OUTPUT"

      - name: Open PR with the new snapshot
        id: pr
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.diff.outputs.week }}
        run: |
          branch="snapshot/${WEEK}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/snapshots
          git commit -m "chore(analytics): weekly snapshot ${WEEK}"
          # --force: this branch is bot-owned (snapshot/YYYY-WW, nothing else
          # ever pushes to it) and the diff check above always compares
          # against main, not against this branch — so re-running while last
          # week's PR is still open and unmerged regenerates the exact same
          # week and must be allowed to overwrite it, not get rejected as a
          # non-fast-forward push.
          git push -u origin "$branch" --force

          {
            echo "Automated weekly Analytics Engine snapshot, generated by \`.github/workflows/weekly-analytics-snapshot.yml\`."
            echo
            node -e "
              const s = require('./data/snapshots/${WEEK}.json');
              console.log('- Period: ' + s.period_start + ' → ' + s.period_end);
              console.log('- App opens: ' + s.app_opens);
              console.log('- Mission starts: ' + s.mission_starts);
              console.log('- Mission completes: ' + s.mission_completes);
            "
            echo
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "Bu PR zamanlanmış haftalık çalışmadan geldi ve bekçiler yeşilse **otomatik yayınlanır** (bkz. CLAUDE.md, Otomatik yayın istisnası)."
            else
              echo "Elle tetiklenmiş backfill — **otomatik yayınlanmaz**. Sayıları inceleyip merge edin."
            fi
          } > pr-body.md

          # A force-push above just refreshed data on an already-open PR for
          # this branch — gh pr create would fail ("already exists") in that
          # case, so only create a new PR when one isn't already open.
          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open for $branch — force-pushed the refreshed snapshot onto it, nothing else to do."
            echo "pr=$existing" >> "$GITHUB_OUTPUT"
          else
            gh pr create \
              --title "chore(analytics): weekly snapshot ${WEEK}" \
              --base main \
              --head "$branch" \
              --body-file pr-body.md
            echo "pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
          fi
          rm -f pr-body.md

      # ── Otomatik yayın ────────────────────────────────────────────────────
      #
      # CLAUDE.md'nin ana kuralı "main'e merge yalnızca kullanıcının açık
      # onayıyla" olmaya devam ediyor. Buradaki istisna dar ve bilinçli: sahibi
      # haftalık raporun elle merge edilmesini kaldırmak istedi, çünkü rapor
      # iki hafta boyunca merge edilmeyi bekleyip panelde hiç görünmedi.
      # İstisnanın sınırları CLAUDE.md'de yazılı; burada uygulanıyor.
      #
      # Yalnızca ZAMANLANMIŞ çalışma yayınlar. Elle tetiklenen backfill
      # yayınlamaz: rutin haftalık rapor her hafta aynı şekli üretir, backfill
      # ise geçmişi yeniden yazabilir — riskli olan o, insan baksın.
      #
      # GITHUB_TOKEN ile yapılan merge, main'de yeni workflow tetiklemez
      # (GitHub'ın döngü koruması). Bu yüzden Analytics Guard'ın kontrolleri
      # merge'den ÖNCE burada, aynı işin içinde çalıştırılıyor — "merge ettik,
      # bekçi sonra bakar" diye bir boşluk kalmasın. Cloudflare dağıtımı kendi
      # GitHub App'i üzerinden tetiklendiği için etkilenmiyor.
      - name: Publish the snapshot (scheduled runs only)
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
          WEEK: ${{ steps.diff.outputs.week }}
        run: |
          if [ -z "$PR" ]; then
            echo "::error::PR numarası çözülemedi — yayınlanmıyor"
            exit 1
          fi

          # 1) Kapsam kilidi: bu PR data/snapshots dışında bir şeye dokunuyorsa
          #    otomatik yayın yok. Beklenmedik bir dosya buraya sızarsa insan
          #    baksın; otomasyonun yetkisi rapor dosyalarıyla sınırlı.
          outside=$(gh pr diff "$PR" --name-only | grep -v '^data/snapshots/' || true)
          if [ -n "$outside" ]; then
            echo "::warning::PR #$PR data/snapshots dışına çıkıyor — otomatik yayın atlandı, inceleme için açık bırakıldı"
            printf '%s\n' "$outside"
            exit 0
          fi

          # 2) Bekçiler. Analytics Guard'ın main'de koştuğu kontrollerin aynısı.
          #    Biri kırmızıysa merge yok: PR açık kalır ve iş başarısız olur.
          node tools/check-event-coverage.mjs
          node tools/check-analytics-compliance.mjs
          node tools/check-beacon-schema.mjs
          node tools/check-tr-invariants.mjs
          node tools/check-mission-entry-sources.mjs
          node tools/check-snapshot-availability.mjs
          node tools/check-trend-semantics.mjs

          # 3) Yayınla. --merge (squash değil): snapshot dalları tek commit
          #    taşıyor ve merge commit'i "bu rapor ne zaman yayınlandı"nın
          #    kaydı oluyor.
          gh pr merge "$PR" --merge --delete-branch
          echo "✅ ${WEEK} yayınlandı (PR #$PR) — /analiz birkaç dakika içinde gösterir."
