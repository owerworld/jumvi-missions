name: Weekly Analytics Snapshot

# Runs tools/generate-weekly-snapshot.mjs on a schedule.
#
# The script's own header calls this "MANUAL ONLY... Faz 1 spec is explicit
# that this must not run on a schedule in this phase" — that constraint is a
# deliberate, superseded decision (product/Ar-Ge asked for an automatic
# weekly report; see the PR that added this workflow). It is recorded here,
# not silently dropped, so a future reader knows the manual-only comment in
# the script itself is now historical, not current policy.
#
# Every Monday 08:00 Europe/Istanbul (UTC+3, no DST) — i.e. 05:00 UTC — this
# queries Cloudflare Analytics Engine for the ISO week that just closed
# (Mon-Sun), which generate-weekly-snapshot.mjs does by default with no
# --week argument. If the resulting JSON differs from what's on disk, it
# opens a PR with the new snapshot for a human to review.
#
# Deliberately does NOT push to main directly or merge automatically — see
# CLAUDE.md: "main'e geçiş/merge işlemi sadece kullanıcının açık onayıyla
# yapılır, otomatik olmaz." The PR this workflow opens is the "report"; a
# human still merges it.
#
# Needs a CLOUDFLARE_API_TOKEN repo secret (Account Analytics: Read).
# CLOUDFLARE_ACCOUNT_ID is optional — the script discovers it via the API
# when the account only has one, same as running this locally.

on:
  schedule:
    - cron: '0 5 * * 1' # Monday 05:00 UTC = 08:00 Europe/Istanbul
  workflow_dispatch: {} # manual "run now", e.g. to backfill or test

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate last week's snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/generate-weekly-snapshot.mjs

      - name: Check for a new/changed snapshot
        id: diff
        run: |
          if git diff --quiet -- data/snapshots; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            week=$(git diff --name-only -- data/snapshots | grep -oE '[0-9]{4}-[0-9]{2}' | head -1)
            echo "week=$week" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with the new snapshot
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.diff.outputs.week }}
        run: |
          branch="snapshot/${WEEK}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/snapshots
          git commit -m "chore(analytics): weekly snapshot ${WEEK}"
          # --force: this branch is bot-owned (snapshot/YYYY-WW, nothing else
          # ever pushes to it) and the diff check above always compares
          # against main, not against this branch — so re-running while last
          # week's PR is still open and unmerged regenerates the exact same
          # week and must be allowed to overwrite it, not get rejected as a
          # non-fast-forward push.
          git push -u origin "$branch" --force

          {
            echo "Automated weekly Analytics Engine snapshot, generated by \`.github/workflows/weekly-analytics-snapshot.yml\`."
            echo
            node -e "
              const s = require('./data/snapshots/${WEEK}.json');
              console.log('- Period: ' + s.period_start + ' → ' + s.period_end);
              console.log('- App opens: ' + s.app_opens);
              console.log('- Mission starts: ' + s.mission_starts);
              console.log('- Mission completes: ' + s.mission_completes);
            "
            echo
            echo "Review the numbers, then merge to publish to /analiz. This workflow never merges on its own."
          } > pr-body.md

          # A force-push above just refreshed data on an already-open PR for
          # this branch — gh pr create would fail ("already exists") in that
          # case, so only create a new PR when one isn't already open.
          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open for $branch — force-pushed the refreshed snapshot onto it, nothing else to do."
          else
            gh pr create \
              --title "chore(analytics): weekly snapshot ${WEEK}" \
              --base main \
              --head "$branch" \
              --body-file pr-body.md
          fi
          rm -f pr-body.md
